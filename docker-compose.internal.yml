services:
  api:
    # `scripts/publish.ts` sets APP_VERSION to the number it just wrote to package.json, so a push is
    # tagged with the build it contains; it re-tags that same image `latest` afterwards. Everything
    # else — `bun run docker`, `bun run build` — leaves the variable unset and works on `latest`.
    image: vierkant/message-server:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Handed to the container so the version it reports is the tag it was pulled as, not just
      # whatever `package.json` inside the image says. Empty when unset, which `src/version.ts`
      # ignores in favour of the manifest.
      - APP_VERSION=${APP_VERSION:-}
      - DB_HOST=${DB_HOST:-database}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET=${SECRET}
      - RATE_LIMIT=${RATE_LIMIT:-100}
      - VERIFY_TOKEN=${VERIFY_TOKEN}
      - APP_SECRET=${APP_SECRET}
      - REDIS_URL=${REDIS_URL:-redis://cache:6379}
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - files:/home/bun/files
    networks:
      - message-network
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  database:
    image: postgres:15-alpine
    hostname: database
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - message-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  cache:
    image: redis:7-alpine
    hostname: cache
    restart: unless-stopped
    # Rate-limit counters are cheap to lose, but queued sends and undelivered webhook notifications
    # are not, so the append-only file is on: a restart must not drop pending retries.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - message-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  message-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  files:
